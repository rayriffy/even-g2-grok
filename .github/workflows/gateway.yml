name: Deploy Grok Bot gateway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: grokbot-gateway-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/rayriffy/grokbot-gateway

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish gateway
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check published container
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
        run: |
          docker run --detach --name gateway-smoke --publish 127.0.0.1:18080:3000 "$IMAGE"
          trap 'docker logs gateway-smoke && docker rm --force gateway-smoke' EXIT
          response="$(curl --fail --silent --show-error --retry 8 --retry-connrefused --retry-delay 1 --max-time 5 \
            http://127.0.0.1:18080/ping)"
          test "$response" = pong

